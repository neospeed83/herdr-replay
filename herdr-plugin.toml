id = "herdr-replay"
name = "Herdr Replay"
version = "0.2.3"
min_herdr_version = "0.8.0"
description = "Record and replay multi-agent coding sessions from Herdr events, terminal evidence, and optional Git context"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["node", "src/install.mjs", "install"]

[[actions]]
id = "toggle"
title = "Start or stop replay recording"
contexts = ["workspace"]
command = ["node", "src/control.mjs", "toggle"]

[[actions]]
id = "start"
title = "Start recording"
contexts = ["workspace"]
command = ["node", "src/control.mjs", "start"]

[[actions]]
id = "stop"
title = "Stop and export replay"
contexts = ["workspace"]
command = ["node", "src/control.mjs", "stop"]

[[actions]]
id = "status"
title = "Replay recording status"
command = ["node", "src/control.mjs", "status"]

[[actions]]
id = "export"
title = "Export latest replay"
command = ["node", "src/control.mjs", "export"]

[[actions]]
id = "open"
title = "Open latest replay"
command = ["node", "src/control.mjs", "open"]

[[actions]]
id = "remove-keybinding"
title = "Remove Replay keybinding"
command = ["node", "src/install.mjs", "remove"]

[[panes]]
id = "viewer"
title = "Herdr Replay"
placement = "popup"
width = "86%"
height = "82%"
command = ["node", "src/viewer.mjs"]
